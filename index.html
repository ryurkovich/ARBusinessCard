<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>CHIO XR AR Business Card</title>

  <!-- =====================================================================
       DO NOT EDIT — AR engine scripts (order matters)
       8frame must load first, then xr.js, then xrextras.
       ===================================================================== -->
  <script src="./external/scripts/8frame-1.5.0.min.js"></script>
  <script async src="./external/xr/xr.js" data-preload-chunks="slam"></script>
  <script src="./external/xrextras/xrextras.js"></script>

  <style>
    #hint-overlay {
      position: fixed;
      bottom: 40px;
      left: 0; right: 0;
      text-align: center;
      color: #fff;
      font-family: sans-serif;
      font-size: 0.85rem;
      pointer-events: none;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      z-index: 100;
      display: none;
    }
  </style>
</head>
<body>

  <div id="hint-overlay">Double-tap to swap models &nbsp;|&nbsp; Pinch to scale &nbsp;|&nbsp; Two-finger drag to rotate</div>

  <!-- =====================================================================
       DO NOT EDIT — scene setup (camera, lights, gesture detector)
       ===================================================================== -->
  <a-scene
    xrweb="disableWorldTracking: true"
    xrextras-loading
    xrextras-runtime-error
    xrextras-gesture-detector
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
  >
    <a-assets>
      <!-- =================================================================
           EDIT HERE — 3D model assets
           Bundled fallbacks stay below. For the workshop, add your Poly Pizza
           .glb under models/custom/ and uncomment (or add) the custom line.
           ================================================================= -->
      <!-- CUSTOM MODEL (workshop personalization): drop your .glb in models/custom/ -->
      <!-- <a-asset-item id="custom-model" src="./models/custom/YOUR-FILE.glb"></a-asset-item> -->

      <!-- Bundled fallbacks — use these only if your custom download fails -->
      <a-asset-item id="robot-model"     src="./models/robot.glb"></a-asset-item>
      <a-asset-item id="crystal-model"   src="./models/crystal.glb"></a-asset-item>
      <a-asset-item id="satellite-model" src="./models/satellite.glb"></a-asset-item>
      <a-asset-item id="trophy-model"    src="./models/trophy.glb"></a-asset-item>
      <a-asset-item id="plant-model"     src="./models/plant.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 4 10" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

    <a-light type="directional" intensity="0.8" position="1 2 1"></a-light>
    <a-light type="ambient" intensity="0.6"></a-light>

    <!-- ===================================================================
         DO NOT EDIT DURING WORKSHOP — image target name must match targetData
         =================================================================== -->
    <xrextras-named-image-target name="qr-code">
      <a-entity
        id="model-wrapper"
        xrextras-pinch-scale="min: 0.1; max: 5.0"
        xrextras-two-finger-rotate
      >
        <!-- =================================================================
             EDIT HERE — which model appears on the default QR
             After adding your custom asset above, set:
               gltf-model="#custom-model"
             Fallback options:
               #robot-model · #crystal-model · #satellite-model · #trophy-model · #plant-model
             ================================================================= -->
        <a-entity
          id="active-model"
          gltf-model="#plant-model"
          scale="0.2 0.2 0.2"
          position="0 0.1 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"
        ></a-entity>
      </a-entity>
    </xrextras-named-image-target>

  </a-scene>

  <script>
    // =======================================================================
    // DO NOT EDIT DURING WORKSHOP — image target (default QR)
    // Generated by @8thwall/image-target-cli from image-targets/qr-code.png.
    // Take-home only: to use a Canva QR instead, regenerate with the CLI and
    // update name= on xrextras-named-image-target to match.
    // =======================================================================
    const targetData = {
      "imagePath": "image-targets/qr-code_luminance.png",
      "metadata": null,
      "name": "qr-code",
      "type": "PLANAR",
      "properties": {
        "left": 198,
        "top": 0,
        "width": 1188,
        "height": 1584,
        "isRotated": true,
        "originalWidth": 1584,
        "originalHeight": 1584
      },
      "resources": {
        "originalImage": "qr-code_original.png",
        "croppedImage": "qr-code_cropped.png",
        "thumbnailImage": "qr-code_thumbnail.png",
        "luminanceImage": "qr-code_luminance.png"
      }
    }

    const onxrloaded = () => {
      XR8.XrController.configure({
        imageTargetData: [targetData],
      })
      document.getElementById('hint-overlay').style.display = 'block'
    }
    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded)

    // =======================================================================
    // Double-tap cycles bundled fallback models (optional after personalizing)
    // If you add a custom model, include it here so double-tap can reach it.
    // =======================================================================
    const models = [
      { id: 'robot-model',     scale: '0.2 0.2 0.2',    position: '0 0.1 0' },
      { id: 'crystal-model',   scale: '0.15 0.15 0.15', position: '0 0.1 0' },
      { id: 'satellite-model', scale: '0.25 0.25 0.25', position: '0 0.1 0' },
      { id: 'trophy-model',    scale: '0.2 0.2 0.2',    position: '0 0.1 0' },
      { id: 'plant-model',     scale: '0.2 0.2 0.2',    position: '0 0.05 0' },
      // { id: 'custom-model',  scale: '0.2 0.2 0.2',    position: '0 0.1 0' },
    ]
    let currentModelIndex = 0
    let lastTap = 0
    let wasMultiTouch = false

    document.addEventListener('touchstart', (e) => {
      if (e.touches.length > 1) wasMultiTouch = true
    }, { passive: true })

    document.addEventListener('touchend', (e) => {
      if (wasMultiTouch) {
        if (e.touches.length === 0) wasMultiTouch = false
        return
      }

      const now = Date.now()
      if (now - lastTap < 300) {
        currentModelIndex = (currentModelIndex + 1) % models.length
        const next = models[currentModelIndex]
        const el = document.getElementById('active-model')
        if (el) {
          el.setAttribute('gltf-model', '#' + next.id)
          el.setAttribute('scale', next.scale)
          el.setAttribute('position', next.position)
        }
        e.preventDefault()
      }
      lastTap = now
    }, { passive: false })
  </script>

</body>
</html>
